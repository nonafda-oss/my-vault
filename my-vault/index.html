<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Secure Vault & Cards</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>body { font-family: 'Prompt', sans-serif; }</style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen pb-12">
    <header class="bg-blue-600 text-white shadow-md p-4 sticky top-0 z-10">
        <div class="max-w-md mx-auto flex justify-between items-center">
            <h1 class="text-xl font-semibold">🔒 ตู้นิรภัย & บันทึกส่วนตัว</h1>
            <span id="cardCount" class="bg-blue-700 text-xs px-3 py-1 rounded-full font-medium">0 รายการ</span>
        </div>
    </header>
    
    <main class="max-w-md mx-auto p-4 space-y-5">
        
        <!-- ฟอร์มเพิ่มข้อมูล -->
        <div class="bg-white rounded-2xl shadow-sm p-4 border border-slate-100">
            <h2 class="text-sm font-semibold mb-3 text-blue-600">➕ เพิ่มบัตร หรือ รหัสลับ</h2>
            <form id="cardForm" class="space-y-2.5">
                <div>
                    <label class="block text-[11px] text-slate-500 mb-1">ชื่อรายการ / ชื่อบัตร / บัญชี</label>
                    <input type="text" id="cardName" required placeholder="เช่น บัตรประชาชน, Passport" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block text-[11px] text-slate-500 mb-1">หมวดหมู่</label>
                        <select id="cardCategory" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm bg-white">
                            <option value="🪪 บัตรราชการ/เอกสาร">🪪 บัตรราชการ</option>
                            <option value="💳 บัตรเครดิต/การเงิน">💳 การเงิน</option>
                            <option value="🏥 บัตรประกัน/สุขภาพ">🏥 สุขภาพ</option>
                            <option value="🔐 รหัสผ่าน / บันทึกลับ">🔐 รหัสผ่าน</option>
                            <option value="🏷️ บัตรสมาชิก/อื่นๆ">🏷️ อื่นๆ</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-[11px] text-slate-500 mb-1">วันหมดอายุ (ถ้ามี)</label>
                        <input type="date" id="cardDate" class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm">
                    </div>
                </div>
                <div>
                    <label class="block text-[11px] text-slate-500 mb-1">บันทึกข้อมูล / รหัสผ่าน / PIN ลับ</label>
                    <textarea id="secretInfo" rows="2" placeholder="ใส่รหัสผ่าน หรือโน้ตลับ..." class="w-full px-3 py-2 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                </div>
                <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2 rounded-xl text-sm font-medium transition cursor-pointer">
                    บันทึกข้อมูล
                </button>
            </form>
        </div>

        <!-- ส่วนค้นหาและกรอง -->
        <div class="space-y-2">
            <div class="flex gap-2">
                <input type="text" id="searchInput" placeholder="🔍 ค้นหาชื่อรายการ..." class="flex-1 px-3 py-2 border border-slate-200 rounded-xl text-sm bg-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                <select id="filterCategory" class="px-3 py-2 border border-slate-200 rounded-xl text-sm bg-white">
                    <option value="all">📁 ทุกหมวด</option>
                    <option value="🪪 บัตรราชการ/เอกสาร">🪪 บัตรราชการ</option>
                    <option value="💳 บัตรเครดิต/การเงิน">💳 การเงิน</option>
                    <option value="🏥 บัตรประกัน/สุขภาพ">🏥 สุขภาพ</option>
                    <option value="🔐 รหัสผ่าน / บันทึกลับ">🔐 รหัสผ่าน</option>
                    <option value="🏷️ บัตรสมาชิก/อื่นๆ">🏷️ อื่นๆ</option>
                </select>
            </div>
        </div>

        <!-- รายการแบบแสดงเฉพาะชื่อ -->
        <div id="cardList" class="space-y-2"></div>
    </main>

    <!-- Modal สำหรับแสดงรายละเอียด -->
    <div id="detailModal" class="fixed inset-0 bg-slate-900/50 hidden flex items-center justify-center p-4 z-50">
        <div class="bg-white rounded-2xl max-w-sm w-full p-5 space-y-4 shadow-xl relative">
            <div>
                <span id="modalCategory" class="text-[11px] font-medium text-slate-400 bg-slate-100 px-2 py-0.5 rounded-md"></span>
                <h3 id="modalName" class="font-semibold text-slate-800 text-lg pt-1"></h3>
                <p id="modalDate" class="text-xs text-slate-500 mt-0.5"></p>
            </div>
            <div class="bg-slate-50 p-3 rounded-xl border border-slate-200">
                <span class="text-[10px] font-bold text-blue-600 block mb-1">🔑 ข้อมูลลับ / รหัสผ่าน:</span>
                <p id="modalSecret" class="text-xs text-slate-700 whitespace-pre-wrap select-all"></p>
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="closeModal()" class="flex-1 bg-slate-100 hover:bg-slate-200 text-slate-700 py-2 rounded-xl text-sm font-medium transition cursor-pointer">
                    ปิด
                </button>
                <button id="modalDeleteBtn" class="bg-rose-50 hover:bg-rose-100 text-rose-600 px-4 py-2 rounded-xl text-sm font-medium transition cursor-pointer">
                    🗑️ ลบ
                </button>
            </div>
        </div>
    </div>

    <script>
        let cards = JSON.parse(localStorage.getItem('my_secure_vault')) || [];
        const cardForm = document.getElementById('cardForm');
        const cardList = document.getElementById('cardList');
        const cardCount = document.getElementById('cardCount');
        const searchInput = document.getElementById('searchInput');
        const filterCategory = document.getElementById('filterCategory');
        
        const detailModal = document.getElementById('detailModal');
        const modalCategory = document.getElementById('modalCategory');
        const modalName = document.getElementById('modalName');
        const modalDate = document.getElementById('modalDate');
        const modalSecret = document.getElementById('modalSecret');
        const modalDeleteBtn = document.getElementById('modalDeleteBtn');
        let currentModalIndex = null;

        function renderCards() {
            const keyword = searchInput.value.toLowerCase();
            const selectedCategory = filterCategory.value;

            const filteredCards = cards.map((card, originalIndex) => ({ ...card, originalIndex })).filter(card => {
                const matchKeyword = card.name.toLowerCase().includes(keyword) || (card.secretInfo && card.secretInfo.toLowerCase().includes(keyword));
                const matchCategory = selectedCategory === 'all' || card.category === selectedCategory;
                return matchKeyword && matchCategory;
            });

            cardCount.innerText = `${cards.length} รายการ`;
            cardList.innerHTML = '';

            if (filteredCards.length === 0) {
                cardList.innerHTML = `<div class="text-center text-slate-400 py-8 bg-white rounded-2xl border border-dashed border-slate-200"><p class="text-sm">ไม่พบข้อมูล</p></div>`;
                return;
            }
            
            filteredCards.forEach((card) => {
                const cardEl = document.createElement('div');
                cardEl.className = `bg-white px-4 py-3 rounded-xl shadow-sm border border-slate-100 flex justify-between items-center hover:border-blue-300 transition cursor-pointer`;
                cardEl.innerHTML = `
                    <div onclick="openModal(${card.originalIndex})" class="flex-1 pr-2">
                        <div class="flex items-center gap-2">
                            <span class="text-xs">${card.category.split(' ')[0]}</span>
                            <h3 class="font-medium text-slate-800 text-sm">${card.name}</h3>
                        </div>
                    </div>
                    <button onclick="openModal(${card.originalIndex})" class="text-xs text-blue-600 bg-blue-50 px-3 py-1.5 rounded-lg hover:bg-blue-100 transition">
                        🔑 ดูรหัส
                    </button>
                `;
                cardList.appendChild(cardEl);
            });
        }

        function openModal(index) {
            currentModalIndex = index;
            const card = cards[index];
            modalCategory.innerText = card.category;
            modalName.innerText = card.name;
            modalDate.innerText = card.date ? `หมดอายุ: ${card.date}` : '';
            modalDate.style.display = card.date ? 'block' : 'none';
            modalSecret.innerText = card.secretInfo || '(ไม่มีข้อมูลลับ)';
            
            modalDeleteBtn.onclick = () => deleteCard(index);
            detailModal.classList.remove('hidden');
        }

        function closeModal() {
            detailModal.classList.add('hidden');
            currentModalIndex = null;
        }

        cardForm.addEventListener('submit', (e) => {
            e.preventDefault();
            cards.push({ 
                name: document.getElementById('cardName').value, 
                category: document.getElementById('cardCategory').value, 
                date: document.getElementById('cardDate').value,
                secretInfo: document.getElementById('secretInfo').value
            });
            localStorage.setItem('my_secure_vault', JSON.stringify(cards));
            cardForm.reset(); 
            renderCards();
        });

        function deleteCard(index) {
            if (confirm('คุณต้องการลบรายการนี้ใช่ไหม?')) {
                cards.splice(index, 1);
                localStorage.setItem('my_secure_vault', JSON.stringify(cards));
                closeModal();
                renderCards();
            }
        }

        searchInput.addEventListener('input', renderCards);
        filterCategory.addEventListener('change', renderCards);

        renderCards();
    </script>
</body>
</html>
